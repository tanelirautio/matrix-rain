<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Matrix Rain</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: dark;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #000;
      }
      #canvas {
        display: block;
      }
      .loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font: 14px/1.4 "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        letter-spacing: 0.06em;
        color: #8fffb8;
        background: radial-gradient(circle at center, #001b0a 0%, #000 70%);
      }
      .loading.hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="loading" class="loading">LOADING MATRIX...</div>
    <canvas id="canvas"></canvas>
    <script>
      var Module = {
        canvas: (function () {
          return document.getElementById('canvas');
        })(),
        setStatus: function (text) {
          var loading = document.getElementById('loading');
          if (!loading) return;
          if (text) {
            loading.textContent = text;
            loading.classList.remove('hidden');
          } else {
            loading.classList.add('hidden');
          }
        },
        monitorRunDependencies: function (left) {
          Module.setStatus(left ? 'LOADING MATRIX... ' + left : '');
        },
        onRuntimeInitialized: function () {
          Module.setStatus('');
        }
      };
    </script>
    {{{ SCRIPT }}}
  </body>
</html>
